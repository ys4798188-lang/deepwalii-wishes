<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शुभ दीपावली एवं महालक्ष्मी पूजन</title>
    <style>
        body {
            background-color: #2b0905;
            background-image: radial-gradient(circle, #4a150c 0%, #2b0905 100%);
            color: #ffebcd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        .main-container {
            max-width: 420px;
            margin: 0 auto;
            background: linear-gradient(135deg, #3d0e07 0%, #210401 100%);
            border: 2px solid #e5ad35;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(229, 173, 53, 0.4);
            position: relative;
        }
        h1 {
            color: #ffdf73;
            font-size: 24px;
            margin: 10px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .shloka {
            font-size: 14px;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed #e5ad35;
            margin: 10px 0;
            line-height: 1.5;
        }
        .image-container {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid #e5ad35;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            margin: 10px 0;
            background: #000;
        }
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .input-section {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            border: 1px solid rgba(229, 173, 53, 0.3);
        }
        label {
            font-size: 15px;
            color: #ffdf73;
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 90%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #e5ad35;
            border-radius: 10px;
            background: #fff;
            color: #333;
            text-align: center;
            outline: none;
            margin-bottom: 12px;
        }
        .btn {
            background: linear-gradient(to bottom, #ffc107, #ff9800);
            color: #2b0905;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.4);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
        }
        #resultSection {
            display: none;
            margin-top: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }
        .btn-whatsapp {
            background: #25D366;
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
        }
        .btn-copy {
            background: #3f51b5;
            color: white;
            margin-top: 10px;
        }
        #toast {
            visibility: hidden;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            padding: 10px;
            position: fixed;
            zIndex: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-container">
        <div style="font-size: 18px; color: #ffdf73;">✨ शुभ दीपावली ✨</div>
        
        <div id="senderGreetingBox" style="display:none; background: rgba(255,215,0,0.15); padding: 8px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ffd700;">
            <span id="senderNameDisplay" style="color: #ffdf73; font-weight: bold; font-size: 15px;"></span>
        </div>

        <h1>शुभ दीपावली एवं महालक्ष्मी पूजन</h1>

        <div class="shloka">
            "ॐ महालक्ष्म्यै च विद्महे विष्णुपत्नी च धीमहि।<br>तन्नो लक्ष्मीः प्रचोदयात्॥"
        </div>

        <div class="image-container" onclick="ringBell()">
            <img id="mainLakshmiImg" src="lakshmi.gif" alt="Maa Lakshmi">
        </div>

        <div style="font-size: 12px; color: #ffebcd; margin-bottom: 5px;">✨ दीये पर टैप करके घंटी बजाएं 🔔</div>

        <!-- Name Input Box -->
        <div class="input-section">
            <label for="userNameInput">✍️ अपना शुभ नाम यहाँ लिखें:</label>
            <input type="text" id="userNameInput" placeholder="उदा. राहुल शर्मा">
            <button type="button" class="btn" onclick="generateGreeting()">
                <span>✨ अपना बधाई संदेश बनाएं</span>
            </button>
        </div>

        <!-- Result & Share on WhatsApp -->
        <div id="resultSection">
            <div style="background: rgba(245, 158, 11, 0.15); border: 1px solid #e5ad35; padding: 12px; border-radius: 10px; margin-bottom: 10px;">
                <div style="font-size: 13px; color: #fde68a;">आपका बधाई संदेश तैयार है! नीचे बटन से शेयर करें:</div>
                <div id="generatedWishText" style="font-size: 15px; font-weight: bold; color: #fff; margin-top: 5px;"></div>
            </div>

            <a id="whatsappShareBtn" href="#" target="_blank" class="btn-whatsapp">
                <span>💬 WhatsApp पर शेयर करें</span>
            </a>

            <button type="button" class="btn btn-copy" onclick="copyShareLink()">
                <span>📋 लिंक कॉपी करें (Copy Link)</span>
            </button>
        </div>

        <div style="font-size: 11px; color: #d97706; margin-top: 15px;">
            🪔 शुभं करोति कल्याणम आरोग्यम धनसंपदा 🪔
        </div>
    </div>

    <div id="toast">लिंक कॉपी हो गया!</div>

    <script>
        var audioCtx = null;
        function ringBell() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 1.8);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 1.8);
            } catch(e) {}
        }

        // Check if opened via shared link
        var urlParams = new URLSearchParams(window.location.search);
        var senderFromUrl = urlParams.get('from');
        if (senderFromUrl && senderFromUrl.trim() !== '') {
            document.getElementById('senderGreetingBox').style.display = 'block';
            document.getElementById('senderNameDisplay').innerText = '✨ ' + senderFromUrl.decodeURIComponent ? decodeURIComponent(senderFromUrl) : senderFromUrl + ' ने आपके लिए भेजा है! ✨';
        }

        var currentShareLink = '';

        function generateGreeting() {
            var nameInput = document.getElementById('userNameInput');
            var name = nameInput.value.trim();
            if (!name) {
                showToast('कृपया पहले अपना नाम लिखें!');
                return;
            }
            ringBell();

            var wishText = '⭐ ' + name + ' की तरफ से आपको और आपके परिवार को दीपावली की हार्दिक शुभकामनाएँ!';
            document.getElementById('generatedWishText').innerText = wishText;

            currentShareLink = 'https://deepwalii-wishes.vercel.app/?from=' + encodeURIComponent(name);

            var waMessage = '✨🪔 *शुभ दीपावली एवं महालक्ष्मी पूजन!* 🪔✨\n\n'
                + '*' + name + '* ने आपके और आपके परिवार के लिए एक अत्यंत सुंदर मंगल संदेश भेजा है!\n\n'
                + 'माँ लक्ष्मी का आशीर्वाद पाने के लिए नीचे लिंक पर क्लिक करें:\n👇👇👇\n'
                + currentShareLink + '\n\n'
                + '🪔 *आप भी अपना नाम लिखकर आगे शेयर कर सकते हैं!*';

            document.getElementById('whatsappShareBtn').href = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(waMessage);
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });
        }

        function copyShareLink() {
            navigator.clipboard.writeText(currentShareLink).then(function() {
                showToast('लिंक कॉपी हो गया!');
            }, function() {
                showToast('लिंक कॉपी करने में विफल!');
            });
        }

        function showToast(text) {
            var x = document.getElementById('toast');
            x.innerText = text;
            x.className = 'show';
            setTimeout(function(){ x.className = x.className.replace('show', ''); }, 3000);
        }
    </script>
</body>
          </html>
